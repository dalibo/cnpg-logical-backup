apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: logical-backup
  name: logical-backup-controller-manager
  namespace: cnpg-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logical-backup
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        app: logical-backup
    spec:
      containers:
      - args:
        - --metrics-bind-address=:8443
        - operator
        - --server-cert=/server/tls.crt
        - --server-key=/server/tls.key
        - --client-cert=/client/tls.crt
        - --server-address=:9090
        - --log-level=debug
        command:
        - /manager
        image: controller-logical-backup:latest
        imagePullPolicy: IfNotPresent
        name: logical-backup-manager
        ports:
        - containerPort: 9090
          protocol: TCP
        readinessProbe:
          initialDelaySeconds: 10
          periodSeconds: 10
          tcpSocket:
            port: 9090
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /server
          name: server
        - mountPath: /client
          name: client
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 10
      volumes:
      - name: server
        secret:
          secretName: logical-backup-controller-server-tls
      - name: client
        secret:
          secretName: logical-backup-controller-client-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: controller-client-tls
  namespace: cnpg-system
spec:
  commonName: logical-backup-controller-client
  duration: 2160h
  isCA: false
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: selfsigned-issuer
  renewBefore: 360h
  secretName: logical-backup-controller-client-tls
  usages:
  - client auth
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: controller-server-tls
  namespace: cnpg-system
spec:
  commonName: logical-backup
  dnsNames:
  - logical-backup
  duration: 2160h
  isCA: false
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: selfsigned-issuer
  renewBefore: 360h
  secretName: logical-backup-controller-server-tls
  usages:
  - server auth
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned-issuer
  namespace: cnpg-system
spec:
  selfSigned: {}
