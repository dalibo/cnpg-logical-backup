---
# This rule is not used by the project logical-backup itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the logical-backup.dalibo.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: logical-backup
    app.kubernetes.io/managed-by: kustomize
  name: logicalbackup-editor-role
rules:
  - apiGroups:
      - logical-backup.dalibo.com
    resources:
      - logicalbackups
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - logical-backup.dalibo.com
    resources:
      - logicalbackups/status
    verbs:
      - get
