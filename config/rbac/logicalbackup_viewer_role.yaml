---
# This rule is not used by the project logical-backup itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to logical-backup.dalibo.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: logical-backup
    app.kubernetes.io/managed-by: kustomize
  name: logicalbackup-viewer-role
rules:
  - apiGroups:
      - logical-backup.dalibo.com
    resources:
      - logicalbackups
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - logical-backup.dalibo.com
    resources:
      - logicalbackups/status
    verbs:
      - get
