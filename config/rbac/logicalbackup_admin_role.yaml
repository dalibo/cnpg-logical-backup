# This rule is not used by the project logical-backup itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over logical-backup.dalibo.com.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: logical-backup
    app.kubernetes.io/managed-by: kustomize
  name: logicalbackup-admin-role
rules:
- apiGroups:
  - logical-backup.dalibo.com
  resources:
  - logicalbackups
  verbs:
  - '*'
- apiGroups:
  - logical-backup.dalibo.com
  resources:
  - logicalbackups/status
  verbs:
  - get
